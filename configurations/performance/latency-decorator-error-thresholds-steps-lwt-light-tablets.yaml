# LWT Light Tablets - predefined throughput steps: gradual-load config + latency thresholds

perf_gradual_threads: {"read": 468, "write": 468, "mixed": 468}
perf_gradual_throttle_steps: {"read": ['267449'], "write": ['23704'], "mixed": ['42496']}
perf_gradual_step_duration: {"read": '30m', "write": '30m', "mixed": '30m'}

# P99 calibrated from a single run at these new targets (worst of tablets/vnodes, +25% margin
# for run-to-run variance), after fixing the HDR tag bug that previously left hdr_summary empty
# (see the set_hdr_tags fix in sdcm/stress_thread.py). P90 stays null: no prior P90 measurement
# exists to calibrate against, and adding new checks is out of scope for this recalibration.
# Note: read P99 is a real, reproducibly high tail latency (~8s) at this fully-unthrottled step,
# not measurement noise - it showed up consistently on both tablets and vnodes.
latency_decorator_error_thresholds:
  write:
    default:
      P90 write:
        fixed_limit: null
      P99 write:
        fixed_limit: 14.93
      Throughput write:
        fixed_limit: 22500

  read:
    default:
      P90 read:
        fixed_limit: null
      P99 read:
        fixed_limit: 9998.18
      Throughput read:
        fixed_limit: 254000

  mixed:
    default:
      P90 write:
        fixed_limit: null
      P90 read:
        fixed_limit: null
      P99 write:
        fixed_limit: 12.44
      P99 read:
        fixed_limit: 4.20
      Throughput write:
        fixed_limit: 20000
