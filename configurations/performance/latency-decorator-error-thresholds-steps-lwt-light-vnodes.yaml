      P99 write:
        fixed_limit: 677.38
      Throughput write:
        fixed_limit: 19000

  read:
    "207900":
      P90 read:
        fixed_limit: 5.07
      P99 read:
        fixed_limit: 139.98
      Throughput read:
        fixed_limit: 198000

  mixed:
    "32600":
      P90 write:
        fixed_limit: 179.18
      P90 read:
        fixed_limit: 114.62
      P99 write:
        fixed_limit: 597.69
      P99 read:
        fixed_limit: 450.36
      Throughput write:
        fixed_limit: 31000
