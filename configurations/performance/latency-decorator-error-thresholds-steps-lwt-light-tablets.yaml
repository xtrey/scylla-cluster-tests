latency_decorator_error_thresholds:
  write:
    default:
      P90 write:
        fixed_limit: null
      P99 write:
        fixed_limit: 13.86
      Throughput write:
        fixed_limit: 22500

  read:
    default:
      P90 read:
        fixed_limit: null
      P99 read:
        fixed_limit: 113.90
      Throughput read:
        fixed_limit: 254000

  mixed:
    default:
      P90 write:
        fixed_limit: null
      P90 read:
        fixed_limit: null
      P99 write:
        fixed_limit: 3.90
      P99 read:
        fixed_limit: 112.69
      Throughput write:
        fixed_limit: 20000
