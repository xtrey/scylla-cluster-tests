# LWT Light Vnodes - predefined throughput steps: gradual-load config + latency thresholds

perf_gradual_throttle_steps:
  read: [{threads: 32, concurrency: 16, rate: '207900'}]
  write: [{threads: 32, concurrency: 16, rate: '20000'}]
  mixed: [{threads: 32, concurrency: 16, rate: '32600'}]
perf_gradual_step_duration: {"read": '60m', "write": '60m', "mixed": '60m'}

latency_decorator_error_thresholds:
