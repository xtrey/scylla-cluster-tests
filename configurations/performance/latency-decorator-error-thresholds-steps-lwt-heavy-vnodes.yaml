# LWT Heavy Vnodes - predefined throughput steps: gradual-load config + latency thresholds

perf_gradual_throttle_steps:
  read: [{threads: 32, concurrency: 16, rate: '28400'}]
  write: [{threads: 32, concurrency: 16, rate: '16800'}]
  mixed: [{threads: 32, concurrency: 16, rate: '25200'}]
perf_gradual_step_duration: {"read": '60m', "write": '60m', "mixed": '60m'}

latency_decorator_error_thresholds:
  write:
    "16800":
      P90 write:
        fixed_limit: 532.68
      P99 write:
        fixed_limit: 1488.98
      Throughput write:
        fixed_limit: 16000

  read:
    "28400":
      P90 read:
        fixed_limit: 147.19
      P99 read:
        fixed_limit: 467.4
      Throughput read:
        fixed_limit: 27000

  mixed:
    "25200":
      P90 write:
        fixed_limit: 326.89
      P90 read:
        fixed_limit: 230.03
      P99 write:
        fixed_limit: 1193.28
      P99 read:
        fixed_limit: 797.44
      Throughput write:
        fixed_limit: 24000
